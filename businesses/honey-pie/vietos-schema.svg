  <title id="lm-t">Schema: kaip rasti HoneyPie Desertai</title>
  <desc id="lm-d">HoneyPie Desertai yra Trakų g. 12 kieme, priešais Vievio kultūros centrą. Atvažiavę Semeliškių gatve, sukite į Trakų gatvę, pravažiuokite IKI parduotuvę ir palikite automobilį kultūros centro aikštelėje kairėje. Pereikite gatvę ir eikite į kiemą tarp 10 ir 12 namų: kavinė kieme, apie 25 metrus nuo gatvės.</desc>
